<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doutor do Motor - Diagnóstico e Ferramentas para Motores Elétricos na Roça</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#9FD3FF; --dot:rgba(0,0,0,.14); --on-bg:#000; --on-bg-soft:#1b1b1b;
  --surface:#FFFFFF; --ink:#000; --line:#000; --shadow:#000;
  --yellow:#FFD23F; --green:#4BE08B; --red:#FF5A52; --lilac:#C9B0FF; --pink:#FFA3D1; --blue:#5AB0FF; --cream:#FFF4C2;
  --muted:#3c3c3c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#20375C; --dot:rgba(255,255,255,.10); --on-bg:#fff; --on-bg-soft:#dfe8f5; }
}
:root[data-theme="dark"]{ --bg:#20375C; --dot:rgba(255,255,255,.10); --on-bg:#fff; --on-bg-soft:#dfe8f5; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.7px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:17px; line-height:1.5;
  overflow-x:hidden;
}
.wrap{max-width:560px; margin:0 auto; padding:14px 18px 56px}
.display{font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif; font-weight:400; letter-spacing:.01em}
h1,h2,h3{margin:0}
h1{font-size:2.35rem; line-height:1.06; color:var(--on-bg)}
h1:focus,h2:focus{outline:none}
.lead{color:var(--on-bg-soft); font-size:1.05rem; margin:12px 0 20px; max-width:32em}
.muted{color:var(--muted)}

/* barra superior */
.top{display:flex; align-items:center; gap:12px; margin-bottom:18px; min-height:48px}
.brand{font-size:1.4rem; color:var(--on-bg); display:flex; align-items:center; gap:10px}
.brand-dot{width:34px;height:34px;border:3px solid var(--line);border-radius:50%;background:var(--yellow);display:grid;place-items:center;box-shadow:2px 2px 0 var(--shadow)}
.brand-dot svg{width:18px;height:18px}
.iconbtn{
  width:48px;height:48px;flex:none;border:3px solid var(--line);border-radius:12px;background:var(--surface);
  box-shadow:4px 4px 0 var(--shadow); font-size:1.4rem; cursor:pointer; display:grid; place-items:center; color:#000;
  transition:transform .08s ease, box-shadow .08s ease;
}
.iconbtn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--shadow)}

/* cards e botoes */
.card{
  background:var(--surface); border:3px solid var(--line); border-radius:18px; box-shadow:6px 6px 0 var(--shadow);
  padding:18px; position:relative;
  animation:cardPop .28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card + .card{margin-top:18px}
@keyframes cardPop{0%{transform:scale(0.97) translateY(8px); opacity:0} 100%{transform:scale(1) translateY(0); opacity:1}}

.btn{
  font:inherit; color:#000; background:var(--surface); border:3px solid var(--line); border-radius:12px;
  box-shadow:5px 5px 0 var(--shadow); padding:14px 16px; width:100%; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:14px; transition:transform .08s ease, box-shadow .08s ease, background-color .1s; text-decoration:none;
}
.btn:active{transform:translate(4px,4px); box-shadow:1px 1px 0 var(--shadow)}
.btn:focus-visible,.iconbtn:focus-visible,summary:focus-visible,.field:focus-visible,.chk:focus-within{outline:4px dashed #000; outline-offset:4px}
.btn .t{font-family:'Lilita One','Arial Rounded MT Bold',Arial,sans-serif; font-size:1.2rem; line-height:1.15; display:block}
.btn .s{font-size:.9rem; color:var(--muted); display:block; margin-top:3px; line-height:1.35}
.btn .ico{
  font-size:1.7rem; flex:none; width:44px; height:44px; display:grid; place-items:center;
  border:3px solid var(--line); border-radius:50%; background:var(--cream);
  box-shadow:1px 1px 0 var(--shadow);
}
.btn-yellow{background:var(--yellow)}
.btn-green{background:var(--green)}
.btn-pink{background:var(--pink)}
.btn-lilac{background:var(--lilac)}
.btn-blue{background:var(--blue)}
.btn-cream{background:var(--cream)}
.btn-big{justify-content:center; text-align:center; padding:18px}
.btn-big .t{font-size:1.35rem}
.stack{display:grid; gap:14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid2 .btn{flex-direction:column; align-items:flex-start; min-height:134px}
.grid2 .btn .ico{margin-bottom:4px}
.grid2 .btn:last-child:nth-child(odd){grid-column:span 2}
.btn.selected{background:var(--yellow)}

/* mascote ultra-animado */
.hero{text-align:left; margin-top:4px}
.mascot{width:200px; height:auto; display:block; margin:0 0 10px -6px; overflow:visible}
.mascot.sm{width:115px}
.mascot .bob{animation:bob 2.6s ease-in-out infinite; transform-origin:100px 140px}
.mascot.shake .bob{animation:shake .32s linear infinite}
.mascot .smoke circle{animation:puff 1.6s ease-out infinite}
.mascot .sweat{animation:drip 1.8s ease-in infinite}
.mascot .sparkle{animation:spark 1.4s ease-in-out infinite alternate}
.mascot .blush{animation:blushGlow 2.5s ease-in-out infinite alternate}
.mascot .fan-spin{animation:spin 1.2s linear infinite; transform-origin:176px 90px}

@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-1.5deg)}40%{transform:translateX(4px) rotate(1.5deg)}60%{transform:translateX(-3px) rotate(-1deg)}80%{transform:translateX(3px) rotate(1deg)}}
@keyframes puff{0%{transform:translate(0,0) scale(0.7);opacity:0.9}100%{transform:translate(-6px,-22px) scale(1.4);opacity:0}}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}40%{opacity:1}80%{transform:translateY(16px);opacity:0.9}100%{transform:translateY(22px);opacity:0}}
@keyframes spark{0%{opacity:0.2; transform:scale(0.8)} 100%{opacity:1; transform:scale(1.2) rotate(15deg)}}
@keyframes blushGlow{0%{opacity:0.75} 100%{opacity:1; filter:brightness(1.1)}}

@media (prefers-reduced-motion:reduce){
  .mascot .bob, .mascot.shake .bob, .mascot .smoke circle, .mascot .sweat, .mascot .sparkle, .mascot .fan-spin, .spin, .belt-track, .meter-hand, .card{
    animation:none!important;
  }
}

.section-title{font-size:1.55rem; color:var(--on-bg); margin:36px 0 14px}
.section-sub{color:var(--on-bg-soft); font-size:.95rem; margin:-6px 0 16px}
.note{background:var(--lilac)}
.note p{margin:0}
.foot{margin-top:36px; font-size:.85rem; color:var(--on-bg-soft); line-height:1.5}
.foot p{margin:4px 0}
/* progresso */
.progress{display:flex; gap:6px; margin:0 0 18px}
.progress span{flex:1; height:14px; border:3px solid var(--line); border-radius:999px; background:var(--surface); transition:background-color .2s}
.progress span.on{background:var(--yellow)}
.step-label{font-size:.92rem; font-weight:700; color:var(--on-bg-soft); margin:0 0 6px}

/* pergunta */
.qhead{display:flex; align-items:flex-end; gap:12px; margin-bottom:10px}
.bubble{position:relative; background:var(--surface); border:3px solid var(--line); border-radius:18px; padding:16px 18px; box-shadow:6px 6px 0 var(--shadow); margin-bottom:20px}
.bubble h2{font-size:1.55rem; line-height:1.15}
.bubble p{margin:8px 0 0; color:var(--muted); font-size:.95rem}
.bubble::before{content:""; position:absolute; left:34px; top:-17px; width:24px; height:24px; background:var(--surface); border-left:3px solid var(--line); border-top:3px solid var(--line); transform:rotate(45deg)}
.hint{margin-top:18px}
details{border:3px solid var(--line); border-radius:12px; background:var(--cream); padding:0; overflow:hidden}
summary{cursor:pointer; padding:12px 14px; font-weight:700; list-style:none; user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+"; display:inline-grid; place-items:center; width:24px;height:24px;border:3px solid var(--line);border-radius:50%;margin-right:10px;font-weight:700;background:var(--surface);line-height:1}
details[open] summary::before{content:"–"}
details .in{padding:0 14px 14px}
details .in p{margin:6px 0}

/* resultado */
.verdict{border:3px solid var(--line); border-radius:22px; box-shadow:7px 7px 0 var(--shadow); padding:18px; display:flex; gap:12px; align-items:center}
.verdict .mascot{width:120px; margin:0; flex:none}
.verdict h2{font-size:1.75rem; line-height:1.05}
.verdict p{margin:6px 0 0; font-size:.95rem}
.g0{background:var(--green)} .g1{background:var(--yellow)} .g2{background:var(--red)}
.safety{margin:20px 0; background:var(--cream); display:flex; gap:12px; align-items:flex-start}
.safety .big{font-size:1.8rem; line-height:1}
.safety p{margin:0}
.cause{position:relative; padding-top:22px}
.cause + .cause{margin-top:26px}
.rank{position:absolute; top:-18px; left:16px; background:var(--surface); border:3px solid var(--line); border-radius:999px; padding:2px 14px; font-size:.95rem; font-weight:700; box-shadow:3px 3px 0 var(--shadow)}
.rank.first{background:var(--pink)}
.cause h3{font-size:1.45rem; line-height:1.15; margin-bottom:6px}
.tag{display:inline-block; border:2px solid var(--line); border-radius:999px; padding:2px 12px; font-size:.82rem; font-weight:700; margin-bottom:10px}
.cause h4{font-size:1rem; margin:14px 0 6px}
.cause ul{margin:0; padding-left:22px}
.cause li{margin:4px 0}
.cause .pro{background:#E8F4FF; border:2px solid var(--line); border-radius:10px; padding:10px 12px; margin:0}
.cause details{margin-top:14px}
.urgent-steps{margin:0; padding-left:24px}
.urgent-steps li{margin:8px 0; font-weight:500}
.actions{display:grid; gap:14px; margin-top:28px}
.actions .btn{text-align:center; justify-content:center}

/* placa metalica */
.placa{background:#CAD1D9; border:3px solid var(--line); border-radius:12px; box-shadow:6px 6px 0 var(--shadow); padding:16px; position:relative}
.placa .screw{position:absolute; width:13px; height:13px; border:2.5px solid var(--line); border-radius:50%; background:#fff; display:grid; place-items:center}
.placa .screw::after{content:""; width:7px; height:2px; background:#000}
.placa .screw.tl{top:8px; left:8px; transform:rotate(25deg)}
.placa .screw.tr{top:8px; right:8px; transform:rotate(70deg)}
.placa .screw.bl{bottom:8px; left:8px; transform:rotate(40deg)}
.placa .screw.br{bottom:8px; right:8px; transform:rotate(15deg)}
.placa-brand{text-align:center; font-family:'Lilita One',Arial,sans-serif; font-size:1.15rem; color:#0A2540; letter-spacing:.03em; margin:2px 20px 12px}
.fields{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.field{
  font:inherit; font-weight:700; font-size:.95rem; background:#fff; border:2.5px solid var(--line); border-radius:8px;
  padding:10px 4px; cursor:pointer; color:#000; text-align:center; transition:transform .08s, background .08s;
  box-shadow:2px 2px 0 var(--shadow);
}
.field:active{transform:translate(2px,2px); box-shadow:0 0 0}
.field.on{background:var(--yellow); box-shadow:3px 3px 0 var(--shadow); transform:translate(-2px,-2px)}
.explain{margin-top:20px; min-height:120px}
.explain h3{font-size:1.35rem; margin-bottom:6px}
.explain p{margin:0}

/* calculadora de polias animada */
.pulley-canvas{width:100%; height:auto; display:block; margin:12px auto; overflow:visible}
.belt-track{stroke-dasharray:8 6; animation:beltMove 1.5s linear infinite}
@keyframes beltMove{to{stroke-dashoffset:-28}}
.slider-box{background:var(--cream); border:2.5px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0}
.slider-box label{display:flex; justify-content:space-between; font-weight:700; font-size:.95rem; margin-bottom:6px}
.slider-box input[type="range"]{width:100%; height:12px; -webkit-appearance:none; background:#fff; border:2px solid var(--line); border-radius:6px; outline:none}
.slider-box input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border:2.5px solid var(--line); border-radius:50%; background:var(--yellow); cursor:pointer; box-shadow:2px 2px 0 var(--shadow)}
.rpm-meter{background:#fff; border:3px solid var(--line); border-radius:14px; padding:14px; text-align:center; margin-top:14px; box-shadow:4px 4px 0 var(--shadow)}
.rpm-val{font-family:'Lilita One',Arial,sans-serif; font-size:2.4rem; color:#000; line-height:1}
.rpm-badge{display:inline-block; border:2px solid var(--line); border-radius:999px; padding:2px 12px; font-weight:700; font-size:.85rem; margin-top:8px}

/* calculadora de extensao / voltimetro */
.volt-box{text-align:center; margin:14px 0}
.volt-svg{width:220px; height:120px; display:block; margin:0 auto; overflow:visible}
.meter-hand{transform-origin:110px 105px; transition:transform .4s cubic-bezier(0.34, 1.56, 0.64, 1)}

/* checklist */
.chk{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:2px dashed #00000033; cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{appearance:none; -webkit-appearance:none; width:30px; height:30px; flex:none; border:3px solid var(--line); border-radius:8px; background:#fff; margin:0; cursor:pointer; display:grid; place-items:center}
.chk input:checked{background:var(--green)}
.chk input:checked::after{content:"✓"; font-weight:700; font-size:1.15rem; color:#000}
.chk input:checked + span{text-decoration:line-through; color:#555}

/* como gira */
.steps{counter-reset:s; list-style:none; margin:0; padding:0}
.steps li{counter-increment:s; position:relative; padding-left:52px; margin:0 0 18px}
.steps li::before{content:counter(s); position:absolute; left:0; top:-2px; width:38px; height:38px; border:3px solid var(--line); border-radius:50%; background:var(--yellow); display:grid; place-items:center; font-family:'Lilita One',Arial,sans-serif; font-size:1.2rem}
.field-anim{display:block; margin:6px auto 16px; width:180px; height:180px}
.spin{animation:spin 2.2s linear infinite; transform-origin:90px 90px}
.spin-field{animation:spin 1.8s linear infinite; transform-origin:90px 90px}
@keyframes spin{to{transform:rotate(360deg)}}

/* maquinas da roca */
.farm-card{display:flex; gap:14px; align-items:flex-start; padding:14px; border:2.5px solid var(--line); border-radius:14px; background:#fff; box-shadow:4px 4px 0 var(--shadow); margin-bottom:12px}
.farm-ico{font-size:2rem; flex:none; width:48px; height:48px; border:2.5px solid var(--line); border-radius:12px; background:var(--cream); display:grid; place-items:center}
.farm-card h3{font-size:1.2rem; margin-bottom:4px}
.farm-card p{margin:0; font-size:.9rem; color:#222}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(140%); background:var(--green); border:3px solid var(--line); border-radius:12px; box-shadow:4px 4px 0 var(--shadow); padding:10px 18px; font-weight:700; transition:transform .22s cubic-bezier(0.34, 1.56, 0.64, 1); z-index:100}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:380px){
  h1{font-size:2rem}
  .grid2{grid-template-columns:1fr}
  .grid2 .btn{min-height:0; flex-direction:row; align-items:center}
  .grid2 .btn:last-child:nth-child(odd){grid-column:span 1}
  .fields{grid-template-columns:repeat(2,1fr)}
  .wrap{padding-left:14px; padding-right:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Base de conhecimento do motor ---------- */
const CAUSES = {
  sem_energia:{t:"A energia não está chegando ao motor", g:1,
    check:["Veja se o disjuntor do galpão ou da casa desarmou.","Confira se o plugue na tomada está firme e se a tomada funciona ligando outro aparelho.","Se usa chave alavanca ou botão liga/desliga, veja se não quebrou por dentro."],
    pro:"Se a tomada tem energia e o disjuntor está armado, o problema pode estar no botão, na fiação até o motor ou dentro da carcaça. Chame o eletricista.",
    why:"Silêncio total significa que a corrente elétrica nem entra nas bobinas. Sem corrente não existe campo magnético, e sem campo o motor não sai do lugar."},
  capacitor:{t:"Capacitor fraco ou queimado", g:1, only:"mono",
    check:["Com o motor fora da tomada, olhe aquele cilindro preto ou prata preso em cima da carcaça.","Sinais clássicos de defeito: estufado parecendo lata de cerveja amassada, trincado, vazando óleo ou cheirando a queimado."],
    pro:"A peça é barata na agropecuária ou loja elétrica, mas o capacitor guarda choque mesmo desligado! Peça para o eletricista descarregar e colocar outro do mesmo valor de microfarads (µF) e voltagem.",
    why:"O motor monofásico de 2 fios sozinho não sabe para qual lado girar. O capacitor atrasa a corrente numa bobina auxiliar e dá o 'empurrão' de partida. Quando estraga, o motor só ronca e esquenta até queimar."},
  centrifuga:{t:"Chave centrífuga suja ou travada", g:1, only:"mono",
    check:["Desconfie dela se o motor zumbe e só pega no tranco, ou se esquenta fervendo logo depois de ligar.","Não abra o motor: essa pecinha com molas e platinado fica escondida na tampa traseira."],
    pro:"Comum pegar serragem, poeira de ração ou fuligem no contato. Precisa abrir a tampa traseira para lixar ou trocar a chave centrífuga e o platinado.",
    why:"A chave centrífuga liga a bobina de partida no começo e desliga com a força centrífuga quando o motor atinge 75% da rotação. Se travar aberta, não parte; se travar fechada, a bobina de partida cozinha."},
  falta_fase:{t:"Falta de uma das fases (motor em 2 fases)", g:2, only:"tri",
    check:["Desligue imediatamente! Motor trifásico funcionando em duas fases queima em poucos minutos.","Veja no quadro se um fusível queimou ou se caiu um polo do disjuntor tripolar.","Pergunte ao vizinho se a rede elétrica da região está oscilando na localidade."],
    pro:"O eletricista vai medir a tensão entre as três fases com multímetro. Se a falta vier da rede da concessionária, ligue para a empresa de energia da sua região.",
    why:"O motor trifásico precisa das 3 fases alternadas para criar o campo magnético que gira sozinho. Faltando uma, o rotor fica puxando corrente absurda nas outras duas bobinas até derreter o verniz."},
  travado:{t:"Eixo travado ou carga pesada demais", g:1,
    check:["Com o motor DESLIGADO da tomada, tente girar o eixo com a mão.","Se tiver correia, tire a correia e gire o motor solto. Se ficar leve, o problema é a máquina (ensiladeira, picador, moenda) e não o motor!","Procure pedaço de madeira, pedra, cordão, sabugo ou ração empedrada travando a navalha."],
    pro:"Se o eixo do motor continuar pesado mesmo sem correia e sem nada preso, o rolamento interno fundiu.",
    why:"Na hora de sair do zero, o motor puxa de 6 a 8 vezes a corrente normal para vencer a inércia. Se a máquina está travada, essa corrente monstruosa não baixa e queima o motor em segundos."},
  rolamento:{t:"Rolamento gasto ou estragado", g:1,
    check:["Motor desligado da energia: gire o eixo devagar com a mão. Sente arranhar como se tivesse areia dentro?","Tente chacoalhar o eixo para cima e para baixo. Não pode ter nenhuma folga ou jogo."],
    pro:"A troca dos rolamentos (ex.: 6204, 6205) é rápida com saca-polia. Não espere: rolamento ruim deixa o rotor raspar no estator e destrói o motor por dentro.",
    why:"O rolamento deixa o rotor girar no centro com mínimo atrito. Quando as esferas gastam, o atrito gera calor brutal e o rotor raspa nas bobinas."},
  subtensao:{t:"Queda de tensão (fim de linha na roça ou fio fino)", g:1,
    check:["Usa extensão comprida de fio fino (1,5mm ou 2,5mm)? Evite ao máximo.","Repare se a luz do galpão amarela e enfraquece na hora que liga o motor.","Piora no fim da tarde, quando vizinhos ligam resfriadores de leite e chuveiros."],
    pro:"O eletricista mede a voltagem com o motor roncando. Se cair de 220V para menos de 195V, precisa engrossar os fios da instalação ou solicitar reforço de transformador à distribuidora.",
    why:"Para entregar a mesma força com menos voltagem, a física exige que a corrente (amperes) aumente. E o calor gerado no fio sobe com o QUADRADO da corrente. Fio fino na roça ferve motor!"},
  sobrecarga:{t:"Motor trabalhando além do que aguenta", g:1,
    check:["A máquina está pedindo mais força do que o normal? Lâmina do triturador cega, correia esticada como corda de violão, madeira muito dura e verde?","Confira se o motor tem cavalos (cv) suficientes para a máquina."],
    pro:"O eletricista coloca o alicate amperímetro no fio com a máquina operando e confere se a corrente passou da amperagem nominal indicada na placa.",
    why:"Quanto mais peso o motor empurra, mais corrente ele puxa. Passou do limite da placa, as bobinas esquentam além do limite térmico do verniz isolante."},
  ventilacao:{t:"Ventilação entupida com poeira ou palha", g:0,

const S = {
  view:"home",
  type:null,
  sym:null,
  qi:0,
  answers:[],
  placaField:null,
  // Calculadora de Polias
  rpmMotor: 1750,
  dMotor: 80,
  dMaq: 120,
  // Calculadora de Extensao
  distM: 50,
  fioMm: 2.5,
  potCv: 2
};
const $app = document.getElementById("app");
const $top = document.getElementById("top");
const sym = () => SYMPTOMS.find(x => x.id === S.sym);

function pts(v){
  if(typeof v === "number") return v;
  if(S.type === "nao_sei") return Math.max(v.mono||0, v.tri||0);
  return v[S.type] || 0;
}
function allowed(id){
  const c = CAUSES[id];
  if(!c) return false;
  return !c.only || S.type === "nao_sei" || c.only === S.type;
}
function diagnose(){
  const s = sym();
  if(!s) return {list:[], g:1, red:false};
  if(s.urgent) return {list:s.urgentCauses.filter(allowed), g:2, red:true};
  const score = {};
  const add = (c,v) => { score[c] = (score[c]||0) + pts(v); };
  (s.base||[]).forEach(b => add(b.c, b.v));
  let red = false;
  S.answers.forEach((ai, qi) => {
    const o = s.qs[qi]?.opts[ai];
    if(!o) return;
    Object.entries(o.fx).forEach(([c,v]) => add(c,v));
    if(o.red) red = true;
  });
  let list = Object.keys(score).filter(c => score[c] > 0 && allowed(c)).sort((a,b) => score[b]-score[a]).slice(0,3);
  if(!list.length) list = s.fallback.filter(allowed).slice(0,3);
  let g = list.length ? Math.max(...list.slice(0,2).map(c => CAUSES[c].g)) : 1;
  if(red) g = 2;
  return {list, g, red};
}

/* ---------- Navegacao ---------- */
function go(view){ S.view = view; render(); }
function back(){
  const v = S.view;
  if(v === "type" || v === "placa" || v === "polias" || v === "extensao" || v === "roca" || v === "check" || v === "gira" || v === "dicionario") return go("home");
  if(v === "symptom") return go("type");
  if(v === "question"){
    if(S.qi === 0) return go("symptom");
    S.qi--; S.answers.pop(); return render();
  }
  if(v === "result"){
    const s = sym();
    if(s.urgent) return go("symptom");
    S.qi = s.qs.length - 1; S.answers.pop(); return go("question");
  }
}

function topbar(){
  const showBack = S.view !== "home";
  $top.innerHTML = `
    ${showBack ? `<button class="iconbtn" data-act="back" aria-label="Voltar">←</button>` : ""}
    <div class="brand display"><span class="brand-dot">${boltIco}</span>Doutor do Motor</div>`;
}

function progress(){
  const s = sym();
  const total = 2 + (s && !s.urgent ? s.qs.length : 3);
  let done = S.view === "type" ? 1 : S.view === "symptom" ? 2 : 2 + S.qi + 1;
  let bars = "";
  for(let i=0;i<total;i++) bars += `<span class="${i<done?"on":""}"></span>`;
  return `<p class="step-label">Passo ${done} de ${total}</p><div class="progress" aria-hidden="true">${bars}</div>`;
}

        <text x="0" y="${r1+24}" font-family="'Lilita One',Arial" font-size="12" text-anchor="middle" fill="#000">Motor: ${dM} mm</text>
      </g>
      <!-- Polia Maquina (Direita) -->

        <circle cx="0" cy="0" r="${r2}" fill="#5AB0FF" stroke="#000" stroke-width="4"/>

      </g>
    </svg>

    <div class="slider-box">
      <label><span>Polia no eixo do Motor:</span> <strong>${dM} mm</strong></label>
      <input type="range" min="40" max="250" step="5" value="${dM}" data-act="slide-motor">

/* ---------- SKILL: Teste de Extensão da Roça (Voltímetro Animado) ---------- */
function viewExtensao(){
  // Calculo simplificado de queda de tensao em 220V cobre
  // I aproximada = potCv * 4 A (em 220V)
  const I = S.potCv * 4;
  // Resistencia cobre = 0.0178 * L * 2 / S
  const R = (0.0178 * S.distM * 2) / S.fioMm;
  const quedaV = Math.round(I * R);
  const vFinal = Math.max(120, 220 - quedaV);
  const percQueda = ((quedaV / 220) * 100).toFixed(1);

  // Angulo do voltimetro: 220V = 35deg, 180V = -35deg
  const angulo = Math.min(45, Math.max(-55, (vFinal - 200) * 1.5));
  let voltCor = "var(--green)";
  let voltMsg = "Tensão excelente! O motor trabalha frio e rende tudo o que tem.";
  let voltMood = "happy";
  if(vFinal < 195 && vFinal >= 180){
    voltCor = "var(--yellow)";
    voltMsg = "Queda perigosa! O motor vai roncar, esquentar bastante e perder força nos picos.";
    voltMood = "worried";
  } else if(vFinal < 180){
    voltCor = "var(--red)";
    voltMsg = "Perigo de queimar! Tensão baixa demais. O enrolamento vai cozinhar o verniz.";
    voltMood = "danger";
  }

  return `
  <h1 class="display" tabindex="-1">Extensão & Fio na Roça</h1>
  <p class="lead">Descubra se o fio fino tá roubando a força do motor no açude, paiol ou galinheiro.</p>

  <div class="card">
    <div class="volt-box">
      <svg class="volt-svg" viewBox="0 0 220 120" role="img" aria-label="Voltímetro analógico marcando a voltagem da ponta">
        <!-- Fundo do mostrador -->
        <path d="M 20 105 A 90 90 0 0 1 200 105 Z" fill="#FFF4C2" stroke="#000" stroke-width="4"/>
        <!-- Faixa vermelha <185V -->
        <path d="M 32 105 A 78 78 0 0 1 70 42" fill="none" stroke="#FF5A52" stroke-width="12"/>
        <!-- Faixa amarela 185-205V -->
        <path d="M 70 42 A 78 78 0 0 1 125 28" fill="none" stroke="#FFD23F" stroke-width="12"/>
        <!-- Faixa verde >205V -->
        <path d="M 125 28 A 78 78 0 0 1 188 105" fill="none" stroke="#4BE08B" stroke-width="12"/>
        <line x1="110" y1="105" x2="110" y2="30" stroke="#000" stroke-width="2" stroke-dasharray="2 3"/>
        <text x="42" y="98" font-family="'Lilita One',Arial" font-size="11" fill="#000">160V</text>
        <text x="110" y="24" font-family="'Lilita One',Arial" font-size="12" text-anchor="middle" fill="#000">200V</text>
        <text x="178" y="98" font-family="'Lilita One',Arial" font-size="11" fill="#000">220V</text>
        <!-- Ponteiro -->
        <g class="meter-hand" style="transform:rotate(${angulo}deg)">
          <line x1="110" y1="105" x2="110" y2="36" stroke="#000" stroke-width="4" stroke-linecap="round"/>
          <circle cx="110" cy="105" r="9" fill="#000"/>
        </g>
      </svg>
      <div style="font-family:'Lilita One',Arial; font-size:2.2rem; color:#000; margin-top:4px">${vFinal} Volts</div>
      <div style="font-size:.9rem; font-weight:700; color:#444">Queda de ${quedaV} V (${percQueda}%) na ponta da máquina</div>
    </div>

    <div class="slider-box">
      <label><span>Distância da tomada até o motor:</span> <strong>${S.distM} metros</strong></label>
      <input type="range" min="5" max="300" step="5" value="${S.distM}" data-act="slide-dist">
    </div>

    <div class="slider-box">
      <label><span>Bitola (grossura) do cabo de cobre:</span> <strong>${S.fioMm} mm²</strong></label>
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px">
        ${[1.5, 2.5, 4.0, 6.0, 10.0].map(mm => `
          <button class="field ${S.fioMm===mm?"on":""}" data-act="set-fio" data-v="${mm}">${mm} mm²</button>
        `).join("")}
      </div>
    </div>

    <div class="slider-box">
      <label><span>Potência do motor:</span> <strong>${S.potCv} cv (cavalos)</strong></label>
      <div style="display:flex; gap:6px; margin-top:6px">
        ${[1, 2, 3, 5, 7.5].map(cv => `
          <button class="field ${S.potCv===cv?"on":""}" style="flex:1" data-act="set-cv" data-v="${cv}">${cv} cv</button>
        `).join("")}
      </div>
    </div>

    <div style="background:${voltCor}; border:3px solid var(--line); border-radius:12px; padding:12px; margin-top:14px; font-weight:700">
      ${voltMsg}
    </div>
  </div>`;
}

      ${PLACA.map(p => `<button class="field ${S.placaField===p.k?"on":""}" data-act="field" data-k="${p.k}" aria-pressed="${S.placaField===p.k}">${p.k}</button>`).join("")}
    </div>
  </div>
  <div class="card explain">
    ${f ? `<h3 class="display">${f.t}</h3><p>${f.d}</p>` : `<h3 class="display">Toque num número da placa</h3><p class="muted">A explicação simples e para que serve aparece aqui sem recarregar a tela.</p>`}
  </div>`;
}

}

    <svg class="field-anim" viewBox="0 0 180 180" role="img" aria-label="Animação do campo magnético girando e rotor acompanhando">

        <rect x="78" y="146" width="24" height="24" rx="5"/>
        <rect x="10" y="78" width="24" height="24" rx="5"/>
        <rect x="146" y="78" width="24" height="24" rx="5"/>
      </g>

      <circle cx="90" cy="90" r="58" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="5 5" opacity=".4"/>
      <!-- Rotor girando no centro -->
      <g class="spin">

    <ol class="steps">

      <li><strong>O rotor corre atrás do campo:</strong> O rotor (a parte do meio que gira) é arrastada por esse magnetismo. Ele gira um pouquinho mais devagar que o campo (a 1.730 RPM). Esse pequeno atraso se chama <em>escorregamento</em> e é ele que produz a força de arrasto!</li>

/* ---------- Resumo Formatado ---------- */
function summary(){
  const s = sym(); if(!s) return "";
  const d = diagnose();
  let t = `Doutor do Motor - Resumo do Diagnóstico\n\n`;
  t += `🔧 Tipo do Motor: ${TYPES[S.type]?.t || "Não informado"}\n`;
  t += `⚠️ Sintoma observado: ${s.t}\n\n`;
  if(!s.urgent && s.qs){
    t += `Perguntas e respostas:\n`;
    s.qs.forEach((q,i) => {
      if(S.answers[i] !== undefined && q.opts[S.answers[i]]){
        t += `• ${q.q} → ${q.opts[S.answers[i]].t}\n`;
      }
    });
    t += `\n`;
  }
  t += `🚦 Gravidade apontada: ${GRAV[d.g].t}\n\n`;
  t += `🔍 Causas mais prováveis:\n`;
  t += d.list.map((c,i) => `${i+1}. ${CAUSES[c].t}`).join("\n");
  t += `\n\nGerado pelo app Doutor do Motor • Extensão Universitária de Engenharia Elétrica`;
  return t;
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2400);
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    try{
      const ta = document.createElement("textarea"); ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}
async function share(){
  const txt = summary();
  if(navigator.share){
    try{ await navigator.share({title:"Doutor do Motor - Diagnóstico", text:txt}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  toast(await copyText(txt) ? "Resumo copiado com sucesso!" : "Não foi possível copiar");
}

/* ---------- Renderizacao e Eventos ---------- */
function render(keep){
  topbar();
  const map = {
    home:viewHome, type:viewType, symptom:viewSymptom, question:viewQuestion, result:viewResult,
    placa:viewPlaca, polias:viewPolias, extensao:viewExtensao, roca:viewRoca, check:viewCheck, gira:viewGira, dicionario:viewDicionario
  };
  $app.innerHTML = map[S.view] ? map[S.view]() : viewHome();
  if(keep) return;
  window.scrollTo(0,0);
  const h = $app.querySelector("[tabindex='-1']"); if(h) h.focus({preventScroll:true});
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a === "back") back();
  else if(a === "start"){ S.type=null; S.sym=null; S.qi=0; S.answers=[]; go("type"); }
  else if(a === "go") go(b.dataset.v);
  else if(a === "type"){ S.type = b.dataset.k; go("symptom"); }
  else if(a === "sym"){ S.sym = b.dataset.k; S.qi = 0; S.answers = []; go(sym().urgent ? "result" : "question"); }
  else if(a === "ans"){
    S.answers[S.qi] = +b.dataset.i;
    if(S.qi < sym().qs.length - 1){ S.qi++; render(); } else go("result");
  }
  else if(a === "share") share();
  else if(a === "restart"){ S.type=null; S.sym=null; S.qi=0; S.answers=[]; go("type"); }
  else if(a === "field"){ S.placaField = b.dataset.k; render(true); const x=$app.querySelector(`.field[data-k="${CSS.escape(S.placaField)}"]`); if(x) x.focus(); }
  else if(a === "resetchk"){ saveChecks({}); render(true); toast("Checklist zerado!"); }
  else if(a === "set-rpm"){ S.rpmMotor = +b.dataset.v; render(true); }
  else if(a === "set-fio"){ S.fioMm = +b.dataset.v; render(true); }
  else if(a === "set-cv"){ S.potCv = +b.dataset.v; render(true); }
});

document.addEventListener("input", e => {
  const el = e.target;
  if(!el.dataset) return;
  if(el.dataset.act === "slide-motor"){ S.dMotor = +el.value; render(true); }
  else if(el.dataset.act === "slide-maq"){ S.dMaq = +el.value; render(true); }
  else if(el.dataset.act === "slide-dist"){ S.distM = +el.value; render(true); }
});

document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset && el.dataset.act === "chk"){ const st = loadChecks(); st[el.dataset.k] = el.checked; saveChecks(st); }
});

render();
</script>
